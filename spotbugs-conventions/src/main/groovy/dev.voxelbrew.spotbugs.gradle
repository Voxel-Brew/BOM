import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'com.github.spotbugs'
}

def exclusions = getClass().getResource('/dev/voxelbrew/spotbugs-exclude.xml').getText('UTF-8')
def writeFilter = tasks.register('writeSpotBugsFilter', dev.voxelbrew.quality.WriteSpotBugsFilter) {
    filterContents.set(exclusions)
    filterFile.set(layout.buildDirectory.file('spotbugs/exclude.xml'))
}

spotbugs {
    excludeFilter.set(writeFilter.flatMap { it.filterFile })
    toolVersion.set('4.10.5')
    effort.set(Effort.valueOf('MAX'))
    reportLevel.set(Confidence.valueOf('MEDIUM'))
    ignoreFailures.set(false)
    reportsDir.set(layout.buildDirectory.dir('reports/spotbugs'))
}

tasks.withType(SpotBugsTask).configureEach { analysis ->
    // Test suites include deliberate failure paths. Check production and provider fixture code.
    analysis.enabled = analysis.name in ['spotbugsMain', 'spotbugsFeatures']
    ['html', 'xml'].each { format ->
        analysis.reports.maybeCreate(format).required.set(true)
    }
}

pluginManager.withPlugin('java') {
    sourceSets.configureEach { sourceSet ->
        def runtimeClasspath = sourceSet.runtimeClasspath
        tasks.named(sourceSet.getTaskName('spotbugs', null), SpotBugsTask).configure {
            auxClassPaths.from(runtimeClasspath)
        }
    }
}
