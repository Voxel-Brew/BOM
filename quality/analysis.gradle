import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsPlugin
import com.github.spotbugs.snom.SpotBugsTask

buildscript {
    repositories { gradlePluginPortal() }
    dependencies { classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.5.13' }
}

apply plugin: 'checkstyle'
apply plugin: SpotBugsPlugin

def policies = 'https://raw.githubusercontent.com/Voxel-Brew/BOM/master/spotbugs-conventions/src/main/resources/dev/voxelbrew'
checkstyle {
    toolVersion = '12.3.1'
    config = resources.text.fromUri("${policies}/checkstyle.xml")
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    exclude '**/persistence/proto/**'
}

def exclusions = resources.text.fromUri("${policies}/spotbugs-exclude.xml")
spotbugs {
    excludeFilter.set(layout.file(providers.provider { exclusions.asFile() }))
    toolVersion.set('4.10.5')
    effort.set(Effort.valueOf('MAX'))
    reportLevel.set(Confidence.valueOf('MEDIUM'))
    ignoreFailures.set(false)
    reportsDir.set(layout.buildDirectory.dir('reports/spotbugs'))
}

tasks.withType(SpotBugsTask).configureEach {
    enabled = name in ['spotbugsMain', 'spotbugsFeatures']
    reports.maybeCreate('html').required.set(true)
    reports.maybeCreate('xml').required.set(true)
}

sourceSets.configureEach { sourceSet ->
    tasks.named(sourceSet.getTaskName('spotbugs', null), SpotBugsTask).configure {
        auxClassPaths.from(sourceSet.runtimeClasspath)
    }
}
