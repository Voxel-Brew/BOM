name: Release BOM to Maven Central
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate without publishing
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency:
  group: bom-release-mutations
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node .github/scripts/release.cjs candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check publishBomPublicationToVerificationRepository
      - run: python3 scripts/verify-publication.py
      - name: Sign and release to Maven Central
        if: ${{ !inputs.dry-run }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_RING_BASE64: ${{ secrets.SIGNING_KEY_RING_BASE64 }}
        run: |
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?Missing MAVEN_CENTRAL_USERNAME}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?Missing MAVEN_CENTRAL_PASSWORD}"
          : "${SIGNING_KEY_ID:?Missing SIGNING_KEY_ID}" "${SIGNING_PASSWORD:?Missing SIGNING_PASSWORD}"
          umask 077
          export SIGNING_KEY_RING="$RUNNER_TEMP/bom-secring.gpg"
          trap 'rm -f "$SIGNING_KEY_RING"' EXIT
          printf '%s' "${SIGNING_KEY_RING_BASE64:?Missing SIGNING_KEY_RING_BASE64}" | base64 --decode > "$SIGNING_KEY_RING"
          ./gradlew --no-daemon signBomPublication -PcentralRelease=true
          node .github/scripts/release.cjs tag
          ./gradlew --no-daemon publishAndReleaseToMavenCentral -PcentralRelease=true
      - name: Create GitHub release and advance patch snapshot
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.cjs finish
      - name: Schedule merge-back
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-merge-back.yml --ref master -f branch="$GITHUB_REF_NAME"
