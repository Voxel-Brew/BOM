name: Release BOM to Maven Central
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag
        run: |
          version=$(sed -n 's/^projectVersion=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "v$version" ]]
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check publishBomPublicationToVerificationRepository
      - run: python3 scripts/verify-publication.py
      - name: Sign and release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_RING_BASE64: ${{ secrets.SIGNING_KEY_RING_BASE64 }}
        run: |
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?Missing MAVEN_CENTRAL_USERNAME}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?Missing MAVEN_CENTRAL_PASSWORD}"
          : "${SIGNING_KEY_ID:?Missing SIGNING_KEY_ID}" "${SIGNING_PASSWORD:?Missing SIGNING_PASSWORD}"
          umask 077
          export SIGNING_KEY_RING="$RUNNER_TEMP/bom-secring.gpg"
          trap 'rm -f "$SIGNING_KEY_RING"' EXIT
          printf '%s' "${SIGNING_KEY_RING_BASE64:?Missing SIGNING_KEY_RING_BASE64}" | base64 --decode > "$SIGNING_KEY_RING"
          ./gradlew --no-daemon publishAndReleaseToMavenCentral -PcentralRelease=true
