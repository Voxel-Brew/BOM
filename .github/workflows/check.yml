name: Check BOM
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check publishBomPublicationToVerificationRepository
      - run: python scripts/verify-publication.py
      - name: Publish snapshot for consumers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew publishBomPublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
