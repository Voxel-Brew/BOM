name: Check BOM
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check publishBomPublicationToVerificationRepository
      - run: python scripts/verify-publication.py
      - run: python -m unittest discover -s scripts -p "*_test.py"
      - run: ./gradlew -p spotbugs-conventions build
      - name: Verify the shared analysis script in a standalone Java build
        shell: bash
        run: |
          sample="$RUNNER_TEMP/quality-consumer"
          mkdir -p "$sample/src/main/java"
          echo "rootProject.name = 'quality-consumer'" > "$sample/settings.gradle"
          cat > "$sample/build.gradle" <<EOF
          plugins { id 'java' }
          repositories { mavenCentral() }
          apply from: file('$GITHUB_WORKSPACE/quality/analysis.gradle')
          EOF
          echo 'public final class Sample {}' > "$sample/src/main/java/Sample.java"
          ./gradlew -p "$sample" checkstyleMain spotbugsMain
      - name: Publish snapshot for consumers
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: ./gradlew publishBomPublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
